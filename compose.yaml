services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: zuckerbot
      POSTGRES_USER: zuckerbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zuckerbot}
      POSTGRES_INITDB_ARGS: --data-checksums
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuckerbot -d zuckerbot"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  bot:
    build:
      context: .
      args:
        RUST_VERSION: 1.98.0
        DEBIAN_SUITE: trixie
        YT_DLP_VERSION: 2026.08.19
        YT_DLP_SHA256: 1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://zuckerbot:${POSTGRES_PASSWORD:-zuckerbot}@postgres:5432/zuckerbot
      SCRIPTS_DIR: /app/scripts
      DASHBOARD_BIND: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./scripts:/app/scripts:ro

volumes:
  postgres-data:
