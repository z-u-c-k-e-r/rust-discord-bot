services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zuckerbot
      POSTGRES_USER: zuckerbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zuckerbot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuckerbot -d zuckerbot"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://zuckerbot:${POSTGRES_PASSWORD:-zuckerbot}@postgres:5432/zuckerbot
      SCRIPTS_DIR: /app/scripts
      DASHBOARD_BIND: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./scripts:/app/scripts:ro

volumes:
  postgres-data:
