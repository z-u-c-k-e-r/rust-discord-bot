services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zuckerbot
      POSTGRES_USER: zuckerbot
      POSTGRES_PASSWORD: zuckerbot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuckerbot -d zuckerbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    command: ["/usr/local/bin/zuckerbot-api"]
    env_file: .env
    environment:
      API_BIND_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: postgres://zuckerbot:zuckerbot@postgres:5432/zuckerbot
      REDIS_URL: redis://redis:6379
      API_RUN_MIGRATIONS: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      target: runtime
    command: ["/usr/local/bin/zuckerbot-bot"]
    env_file: .env
    volumes:
      - ./plugins:/app/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
