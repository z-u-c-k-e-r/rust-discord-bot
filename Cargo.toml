[workspace]
members = [
    "apps/api",
    "apps/bot",
    "crates/config",
    "crates/core",
    "crates/lua-runtime",
    "crates/persistence",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/z-u-c-k-e-r/rust-discord-bot"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
dotenvy = "0.15"
mlua = { version = "0.12.1", features = ["error-send", "lua54", "send", "serde", "vendored"] }
redis = { version = "1.5.0", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend", "voice"] }
sha2 = "0.10"
songbird = { version = "0.6.0", default-features = true }
sqlx = { version = "0.8.6", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.21", features = ["serde", "v4"] }
