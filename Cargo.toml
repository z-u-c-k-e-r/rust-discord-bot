[package]
name = "zuckerbot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lua-scriptable Discord automation platform written in Rust"
repository = "https://github.com/z-u-c-k-e-r/rust-discord-bot"

[dependencies]
anyhow = "1"
axum = "0.8"
dashmap = "6"
dotenvy = "0.15"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize", "send"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend", "utils", "voice"] }
songbird = { version = "0.5", features = ["builtin-queue", "serenity"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
