[package]
name = "zuckerbot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Adrian Banach"]
license = "MIT"
repository = "https://github.com/z-u-c-k-e-r/rust-discord-bot"
description = "A secure, Lua-scriptable Discord automation platform written in Rust."
publish = false

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["http1", "json", "query", "tokio"] }
chrono = { version = "=0.4.45", features = ["serde"] }
dashmap = "=6.2.1"
dotenvy = "=0.15.7"
mlua = { version = "=0.12.1", features = ["lua54", "vendored", "serde", "send"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "rustls"] }
# Songbird 0.6.0's stable YoutubeDl API still accepts reqwest 0.12. Keep this
# compatibility client isolated from the application's current reqwest client.
reqwest-songbird = { package = "reqwest", version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serenity = { version = "=0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "http",
    "model",
    "rustls_backend",
    "utils",
    "voice",
] }
songbird = { version = "=0.6.0", features = ["builtin-queue"] }
sqlx = { version = "=0.9.0", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
