[package]
name = "zuckerbot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Adrian Banach"]
license = "MIT"
repository = "https://github.com/z-u-c-k-e-r/rust-discord-bot"
description = "A secure, Lua-scriptable Discord automation platform written in Rust."
publish = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.4", features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4.41", features = ["serde"] }
dashmap = "6.1"
dotenvy = "0.15"
mlua = { version = "0.12.1", features = ["lua54", "vendored", "serde", "send"] }
reqwest = { version = "0.12.22", default-features = false, features = ["form", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serenity = { version = "0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "http",
    "model",
    "rustls_backend",
    "utils",
    "voice",
] }
songbird = { version = "0.6.0", features = ["builtin-queue"] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio-rustls",
] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
