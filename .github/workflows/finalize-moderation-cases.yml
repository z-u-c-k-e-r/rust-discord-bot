name: Finalize moderation case persistence

on:
  push:
    branches:
      - feat/moderation-case-management
    paths:
      - '.github/finalize-moderation-cases.trigger'

permissions:
  contents: write

concurrency:
  group: finalize-moderation-case-persistence
  cancel-in-progress: false

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: zuckerbot
          POSTGRES_USER: zuckerbot
          POSTGRES_PASSWORD: zuckerbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zuckerbot -d zuckerbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install native and PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libopus-dev \
            pkg-config \
            postgresql-client

      - name: Enforce latest stable Rust policy
        run: bash scripts/check-latest-rust.sh

      - name: Ensure moderation cases are exported
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib.rs')
          source = path.read_text(encoding='utf-8')
          declaration = 'pub mod moderation_cases;\n'
          if declaration not in source:
              marker = 'pub mod lua;\n'
              source = source.replace(marker, marker + declaration, 1) if marker in source else declaration + source
              path.write_text(source, encoding='utf-8')
          PY

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f src/moderation_cases/mod.rs
          test -f src/moderation_cases/model.rs
          test -f src/moderation_cases/memory.rs
          test -f src/moderation_cases/postgres.rs
          test -f migrations/0005_moderation_cases.sql
          test -f tests/moderation_cases.rs
          test -f docs/MODERATION_CASES.md

      - name: Format source
        run: cargo fmt --all

      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run all tests
        run: cargo test --locked --all-features

      - name: Apply every migration to PostgreSQL 18.6
        env:
          PGPASSWORD: zuckerbot
        shell: bash
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            psql \
              --host 127.0.0.1 \
              --port 5432 \
              --username zuckerbot \
              --dbname zuckerbot \
              --set ON_ERROR_STOP=1 \
              --file "${migration}"
          done

      - name: Build release binary
        run: cargo build --locked --release

      - name: Validate dashboard JavaScript
        run: node --check web/static/app.js

      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose -f compose.yaml config --quiet

      - name: Build production image
        run: docker build --tag zuckerbot:moderation-cases-final .

      - name: Remove one-time validation transport
        run: |
          rm -f .github/finalize-moderation-cases.trigger
          rm -f .github/workflows/finalize-moderation-cases.yml

      - name: Commit exact validated tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(cases): finalize validated moderation persistence"
          git push origin HEAD:feat/moderation-case-management
