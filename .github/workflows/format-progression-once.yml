name: One-shot progression formatter

on:
  push:
    branches:
      - feat/progression-economy

permissions:
  contents: write

concurrency:
  group: one-shot-progression-formatter
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          ref: feat/progression-economy

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Format and commit only when needed
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply cargo fmt to progression stack"
          git push origin HEAD:feat/progression-economy
