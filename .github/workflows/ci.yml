name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/progression-economy

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install voice build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libopus-dev \
            pkg-config

      - name: Verify the project tracks the latest stable Rust release
        run: bash scripts/check-latest-rust.sh

      - name: Resolve the pinned dependency graph
        run: cargo generate-lockfile

      - name: Check formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee rustfmt.log

      - name: Run Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-features 2>&1 | tee tests.log

      - name: Build release binary
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked --release 2>&1 | tee release-build.log

      - name: Upload Rust diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-diagnostics-${{ github.run_id }}-${{ github.job }}
          path: |
            rustfmt.log
            clippy.log
            tests.log
            release-build.log
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Build production container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        shell: bash
        run: |
          set -o pipefail
          docker build --tag zuckerbot:ci . 2>&1 | tee docker-build.log

      - name: Upload container diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-diagnostics-${{ github.run_id }}-${{ github.job }}
          path: docker-build.log
          if-no-files-found: error
          retention-days: 7
