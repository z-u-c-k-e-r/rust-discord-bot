name: Modernize platform stack

on:
  push:
    branches:
      - feat/lua-platform-foundation
    paths:
      - .github/modernize-stack.trigger

permissions:
  contents: write

concurrency:
  group: modernize-lua-platform-foundation
  cancel-in-progress: false

jobs:
  modernize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/lua-platform-foundation
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            jq \
            libopus-dev \
            pkg-config

      - name: Install newest stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install modernization tooling
        run: python3 -m pip install --disable-pip-version-check --break-system-packages packaging tomlkit

      - name: Upgrade Rust, crates, Lua, actions and containers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > /tmp/modernize.py <<'PY'
          from __future__ import annotations

          import copy
          import json
          import os
          import re
          import shutil
          import subprocess
          import urllib.request
          from dataclasses import dataclass
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          import tomlkit
          from packaging.version import InvalidVersion, Version

          ROOT = Path.cwd()
          CARGO = ROOT / "Cargo.toml"
          LOCK = ROOT / "Cargo.lock"
          USER_AGENT = "ZuckerBot dependency modernizer/1.0 (+https://github.com/z-u-c-k-e-r/rust-discord-bot)"
          TIMEOUT = 900


          @dataclass
          class UpgradeResult:
              name: str
              previous: str
              newest: str
              selected: str
              status: str
              blocker: str = ""


          def request_json(url: str) -> dict[str, Any]:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": USER_AGENT,
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          def stable_versions(crate: str) -> list[str]:
              payload = request_json(f"https://crates.io/api/v1/crates/{crate}")
              candidates: list[tuple[Version, str]] = []
              for entry in payload.get("versions", []):
                  raw = str(entry.get("num", ""))
                  if not raw or entry.get("yanked", False):
                      continue
                  try:
                      parsed = Version(raw)
                  except InvalidVersion:
                      continue
                  if parsed.is_prerelease or parsed.is_devrelease:
                      continue
                  candidates.append((parsed, raw))
              candidates.sort(reverse=True)
              if not candidates:
                  raise RuntimeError(f"No stable, non-yanked release found for {crate}")
              return [raw for _, raw in candidates]


          def compatibility_key(raw: str) -> tuple[int, ...]:
              version = Version(raw.lstrip("=~^<> "))
              if version.major == 0:
                  return (version.major, version.minor)
              return (version.major,)


          def run(command: list[str], *, timeout: int = TIMEOUT) -> tuple[bool, str]:
              process = subprocess.run(
                  command,
                  cwd=ROOT,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
                  check=False,
                  env={**os.environ, "CARGO_TERM_COLOR": "never"},
              )
              output = process.stdout[-12000:]
              return process.returncode == 0, output


          def concise_error(output: str) -> str:
              lines = []
              for line in output.splitlines():
                  plain = re.sub(r"\x1b\[[0-9;]*m", "", line).strip()
                  if not plain:
                      continue
                  if "error" in plain.lower() or plain.startswith("Caused by:"):
                      lines.append(plain)
                  if len(lines) >= 5:
                      break
              if not lines:
                  lines = [line.strip() for line in output.splitlines()[-5:] if line.strip()]
              return " / ".join(lines)[:1000]


          def restore(path: Path, content: bytes | None) -> None:
              if content is None:
                  path.unlink(missing_ok=True)
              else:
                  path.write_bytes(content)


          rustc_ok, rustc_output = run(["rustc", "--version"], timeout=30)
          if not rustc_ok:
              raise RuntimeError(rustc_output)
          match = re.search(r"rustc\s+(\d+\.\d+\.\d+)", rustc_output)
          if not match:
              raise RuntimeError(f"Could not parse rustc version: {rustc_output}")
          rust_version = match.group(1)

          original_text = CARGO.read_text(encoding="utf-8")
          document = tomlkit.parse(original_text)
          document["package"]["edition"] = "2024"
          document["package"]["rust-version"] = rust_version

          clippy = document.get("lints", {}).get("clippy")
          if clippy is not None and clippy.get("all") == "warn":
              clippy["all"] = {"level": "warn", "priority": -1}

          CARGO.write_text(tomlkit.dumps(document), encoding="utf-8")
          (ROOT / "rust-toolchain.toml").write_text(
              "[toolchain]\n"
              f"channel = \"{rust_version}\"\n"
              "profile = \"minimal\"\n"
              "components = [\"clippy\", \"rustfmt\"]\n",
              encoding="utf-8",
          )

          baseline_ok, baseline_output = run(["cargo", "check", "--all-targets", "--all-features"])
          if not baseline_ok:
              raise RuntimeError("Baseline does not compile on newest stable Rust: " + concise_error(baseline_output))

          results: list[UpgradeResult] = []
          dependency_sections = ["dependencies", "dev-dependencies", "build-dependencies"]

          for section_name in dependency_sections:
              document = tomlkit.parse(CARGO.read_text(encoding="utf-8"))
              section = document.get(section_name)
              if not section:
                  continue
              for crate in list(section.keys()):
                  document = tomlkit.parse(CARGO.read_text(encoding="utf-8"))
                  dependency = document[section_name][crate]
                  if isinstance(dependency, str):
                      old_constraint = dependency
                  elif isinstance(dependency, dict) or hasattr(dependency, "get"):
                      old_constraint = dependency.get("version")
                  else:
                      continue
                  if not old_constraint:
                      continue

                  try:
                      old_version = str(old_constraint).lstrip("=~^<> ")
                      available = stable_versions(crate)
                  except Exception as error:  # noqa: BLE001 - report per dependency
                      results.append(
                          UpgradeResult(crate, str(old_constraint), "unknown", str(old_constraint), "metadata-error", str(error))
                      )
                      continue

                  newest = available[0]
                  candidates = [newest]
                  try:
                      key = compatibility_key(old_version)
                      compatible = next(
                          version for version in available if compatibility_key(version) == key
                      )
                      if compatible not in candidates:
                          candidates.append(compatible)
                  except Exception:  # noqa: BLE001 - malformed legacy constraint, newest is still tested
                      pass

                  cargo_before = CARGO.read_bytes()
                  lock_before = LOCK.read_bytes() if LOCK.exists() else None
                  selected = old_version
                  status = "blocked"
                  blocker = ""

                  for candidate in candidates:
                      restore(CARGO, cargo_before)
                      restore(LOCK, lock_before)
                      candidate_document = tomlkit.parse(CARGO.read_text(encoding="utf-8"))
                      candidate_dependency = candidate_document[section_name][crate]
                      exact = f"={candidate}"
                      if isinstance(candidate_dependency, str):
                          candidate_document[section_name][crate] = exact
                      else:
                          candidate_dependency["version"] = exact
                      CARGO.write_text(tomlkit.dumps(candidate_document), encoding="utf-8")

                      success, output = run(["cargo", "check", "--all-targets", "--all-features"])
                      if success:
                          selected = candidate
                          status = "latest" if candidate == newest else "latest-compatible"
                          blocker = "" if candidate == newest else f"Newest {newest} failed: {blocker}"
                          cargo_before = CARGO.read_bytes()
                          lock_before = LOCK.read_bytes() if LOCK.exists() else None
                          break
                      blocker = concise_error(output)

                  if status == "blocked":
                      restore(CARGO, cargo_before)
                      restore(LOCK, lock_before)
                      selected = old_version

                  results.append(
                      UpgradeResult(crate, old_version, newest, selected, status, blocker)
                  )

          # Prefer the newest Lua language generation supported by the selected mlua release.
          lua_status = "unchanged"
          lua_blocker = ""
          document = tomlkit.parse(CARGO.read_text(encoding="utf-8"))
          mlua = document.get("dependencies", {}).get("mlua")
          if mlua and not isinstance(mlua, str):
              selected_mlua = str(mlua.get("version", "")).lstrip("=~^<> ")
              try:
                  metadata = request_json(f"https://crates.io/api/v1/crates/mlua/{selected_mlua}")
                  features = set(metadata.get("version", {}).get("features", {}).keys())
                  target_lua = next((feature for feature in ("lua55", "lua54") if feature in features), None)
                  current_features = list(mlua.get("features", []))
                  current_lua = next((feature for feature in current_features if re.fullmatch(r"lua\d+", feature)), None)
                  if target_lua and target_lua != current_lua:
                      cargo_before = CARGO.read_bytes()
                      lock_before = LOCK.read_bytes() if LOCK.exists() else None
                      mlua["features"] = [
                          target_lua if feature == current_lua else feature for feature in current_features
                      ] if current_lua else [*current_features, target_lua]
                      CARGO.write_text(tomlkit.dumps(document), encoding="utf-8")
                      success, output = run(["cargo", "check", "--all-targets", "--all-features"])
                      if success:
                          lua_status = f"upgraded from {current_lua or 'unspecified'} to {target_lua}"
                      else:
                          restore(CARGO, cargo_before)
                          restore(LOCK, lock_before)
                          lua_status = f"kept {current_lua or 'unspecified'}"
                          lua_blocker = concise_error(output)
                  else:
                      lua_status = f"using {current_lua or target_lua or 'embedded runtime'}"
              except Exception as error:  # noqa: BLE001
                  lua_blocker = str(error)


          def latest_release(repo: str) -> tuple[str, str] | None:
              try:
                  release = request_json(f"https://api.github.com/repos/{repo}/releases/latest")
                  tag = str(release["tag_name"])
                  ref = request_json(f"https://api.github.com/repos/{repo}/git/ref/tags/{tag}")
                  sha = str(ref["object"]["sha"])
                  if ref["object"].get("type") == "tag":
                      tag_object = request_json(f"https://api.github.com/repos/{repo}/git/tags/{sha}")
                      sha = str(tag_object["object"]["sha"])
                  return tag, sha
              except Exception:  # noqa: BLE001
                  return None


          def branch_head(repo: str, branch: str) -> str | None:
              try:
                  payload = request_json(f"https://api.github.com/repos/{repo}/commits/{branch}")
                  return str(payload["sha"])
              except Exception:  # noqa: BLE001
                  return None


          action_versions: list[str] = []
          workflow_paths = list((ROOT / ".github" / "workflows").glob("*.yml")) + list(
              (ROOT / ".github" / "workflows").glob("*.yaml")
          )
          action_repositories = {
              "actions/checkout": latest_release("actions/checkout"),
              "Swatinem/rust-cache": latest_release("Swatinem/rust-cache"),
          }
          dtolnay_sha = branch_head("dtolnay/rust-toolchain", "master")
          if dtolnay_sha:
              action_repositories["dtolnay/rust-toolchain"] = ("master", dtolnay_sha)

          for workflow_path in workflow_paths:
              if workflow_path.name == "modernize-stack.yml":
                  continue
              text = workflow_path.read_text(encoding="utf-8")
              for repository, release_info in action_repositories.items():
                  if not release_info:
                      continue
                  tag, sha = release_info
                  pattern = rf"uses:\s*{re.escape(repository)}@[^\s#]+(?:\s*#.*)?"
                  replacement = f"uses: {repository}@{sha} # {tag}"
                  text, count = re.subn(pattern, replacement, text)
                  if count:
                      action_versions.append(f"{repository}: {tag} ({sha})")
              text = re.sub(
                  r"(?m)^(\s*toolchain:\s*)1\.\d+(?:\.\d+)?\s*$",
                  rf"\g<1>{rust_version}",
                  text,
              )
              workflow_path.write_text(text, encoding="utf-8")


          def docker_tags(image: str) -> list[str]:
              tags: list[str] = []
              url = f"https://hub.docker.com/v2/repositories/library/{image}/tags?page_size=100"
              for _ in range(10):
                  payload = request_json(url)
                  tags.extend(str(item["name"]) for item in payload.get("results", []))
                  next_url = payload.get("next")
                  if not next_url:
                      break
                  url = str(next_url)
              return tags


          def highest_image_tag(image: str, suffix: str) -> str | None:
              candidates: list[tuple[Version, str]] = []
              for tag in docker_tags(image):
                  if not tag.endswith(suffix):
                      continue
                  raw = tag[: -len(suffix)]
                  try:
                      parsed = Version(raw)
                  except InvalidVersion:
                      continue
                  if parsed.is_prerelease or parsed.is_devrelease:
                      continue
                  candidates.append((parsed, tag))
              candidates.sort(reverse=True)
              return candidates[0][1] if candidates else None


          container_versions: list[str] = []
          try:
              rust_tag = f"{rust_version}-bookworm"
              postgres_tag = highest_image_tag("postgres", "-bookworm")
              redis_tag = highest_image_tag("redis", "-bookworm")
              replacements = {
                  "rust": rust_tag,
                  "postgres": postgres_tag,
                  "redis": redis_tag,
              }
              infra_paths = [ROOT / "Dockerfile", ROOT / "compose.yaml", ROOT / "docker-compose.yml"]
              for path in infra_paths:
                  if not path.exists():
                      continue
                  text = path.read_text(encoding="utf-8")
                  for image, tag in replacements.items():
                      if not tag:
                          continue
                      text, count = re.subn(
                          rf"(?m)(\b(?:FROM\s+)?{re.escape(image)}:)[^\s]+",
                          rf"\g<1>{tag}",
                          text,
                      )
                      if count:
                          container_versions.append(f"{image}:{tag}")
                  path.write_text(text, encoding="utf-8")
          except Exception as error:  # noqa: BLE001
              container_versions.append(f"container metadata error: {error}")

          dependabot = ROOT / ".github" / "dependabot.yml"
          dependabot.parent.mkdir(parents=True, exist_ok=True)
          dependabot.write_text(
              "version: 2\n"
              "updates:\n"
              "  - package-ecosystem: cargo\n"
              "    directory: /\n"
              "    schedule:\n"
              "      interval: daily\n"
              "    open-pull-requests-limit: 10\n"
              "    labels: [dependencies, rust]\n"
              "  - package-ecosystem: github-actions\n"
              "    directory: /\n"
              "    schedule:\n"
              "      interval: weekly\n"
              "    labels: [dependencies, ci]\n"
              "  - package-ecosystem: docker\n"
              "    directory: /\n"
              "    schedule:\n"
              "      interval: weekly\n"
              "    labels: [dependencies, docker]\n",
              encoding="utf-8",
          )

          policy = ROOT / "docs" / "DEPENDENCY_POLICY.md"
          policy.write_text(
              "# Dependency policy\n\n"
              "ZuckerBot tracks the newest stable Rust toolchain and the newest stable dependency releases. "
              "Versions are exact in manifests and reproducible through `Cargo.lock`.\n\n"
              "A dependency may remain below its newest release only when the newer release fails the full "
              "workspace compile/test gate or has an identified ecosystem compatibility blocker. Every exception "
              "must be recorded in `DEPENDENCY_STATUS.md` and migrated in a dedicated pull request.\n\n"
              "Dependabot checks Cargo dependencies daily and GitHub Actions/Docker images weekly. Merges require "
              "formatting, Clippy with warnings denied, tests, an audit and a reproducible release build.\n",
              encoding="utf-8",
          )

          final_check_ok, final_check_output = run(["cargo", "check", "--all-targets", "--all-features"])
          if not final_check_ok:
              raise RuntimeError("Final dependency set does not compile: " + concise_error(final_check_output))

          run(["cargo", "fmt", "--all"], timeout=120)
          clippy_ok, clippy_output = run(
              ["cargo", "clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
          )
          tests_ok, tests_output = run(["cargo", "test", "--all-features"])

          lines = [
              "# Current dependency status",
              "",
              f"Generated: {datetime.now(timezone.utc).isoformat()}",
              "",
              f"- Rust: `{rust_version}` (newest stable installed by rustup)",
              f"- Edition: `2024`",
              f"- Lua runtime: {lua_status}",
              f"- Workspace compile: {'PASS' if final_check_ok else 'FAIL'}",
              f"- Clippy `-D warnings`: {'PASS' if clippy_ok else 'FAIL'}",
              f"- Tests: {'PASS' if tests_ok else 'FAIL'}",
              "",
              "## Rust crates",
              "",
              "| Crate | Previous | Newest stable | Selected | Result |",
              "|---|---:|---:|---:|---|",
          ]
          for result in sorted(results, key=lambda item: item.name.lower()):
              lines.append(
                  f"| `{result.name}` | `{result.previous}` | `{result.newest}` | `{result.selected}` | {result.status} |"
              )

          blockers = [result for result in results if result.blocker]
          if blockers or lua_blocker or not clippy_ok or not tests_ok:
              lines.extend(["", "## Recorded blockers", ""])
              for result in blockers:
                  lines.append(f"- **{result.name}:** {result.blocker}")
              if lua_blocker:
                  lines.append(f"- **Lua language upgrade:** {lua_blocker}")
              if not clippy_ok:
                  lines.append(f"- **Clippy:** {concise_error(clippy_output)}")
              if not tests_ok:
                  lines.append(f"- **Tests:** {concise_error(tests_output)}")

          if action_versions:
              lines.extend(["", "## GitHub Actions", ""])
              lines.extend(f"- `{entry}`" for entry in sorted(set(action_versions)))
          if container_versions:
              lines.extend(["", "## Container images", ""])
              lines.extend(f"- `{entry}`" for entry in sorted(set(container_versions)))

          lines.extend(
              [
                  "",
                  "## Reproduction",
                  "",
                  "```bash",
                  "rustc --version",
                  "cargo fmt --all -- --check",
                  "cargo clippy --all-targets --all-features -- -D warnings",
                  "cargo test --all-features",
                  "cargo build --release --all-features",
                  "```",
                  "",
              ]
          )
          (ROOT / "docs" / "DEPENDENCY_STATUS.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          python3 /tmp/modernize.py

      - name: Validate release build
        run: cargo build --release --all-features

      - name: Commit the modernized stack
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/modernize-stack.trigger
          rm -f .github/workflows/modernize-stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No modernization changes to commit"
            exit 0
          fi
          git commit -m "chore: modernize to latest stable platform stack"
          git push origin HEAD:feat/lua-platform-foundation
