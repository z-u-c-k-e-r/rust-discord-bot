name: Refresh current stable platform

on:
  push:
    branches:
      - feat/lua-platform-foundation
    paths:
      - .github/workflows/refresh-current-stable.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-current-stable
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the canonical feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/lua-platform-foundation
          fetch-depth: 0

      - name: Install native voice build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libopus-dev \
            pkg-config

      - name: Resolve and apply current stable versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          import re
          import shutil
          import tomllib
          import urllib.request
          from pathlib import Path

          crates = [
              "anyhow",
              "axum",
              "chrono",
              "dashmap",
              "dotenvy",
              "mlua",
              "reqwest",
              "serde",
              "serde_json",
              "serenity",
              "songbird",
              "sqlx",
              "tempfile",
              "thiserror",
              "tokio",
              "tower-http",
              "tracing",
              "tracing-subscriber",
              "url",
              "uuid",
          ]

          def fetch_json(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "ZuckerBot dependency refresh"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          with urllib.request.urlopen(
              "https://static.rust-lang.org/dist/channel-rust-stable.toml",
              timeout=30,
          ) as response:
              stable_manifest = tomllib.loads(response.read().decode("utf-8"))

          rust_version = stable_manifest["pkg"]["rust"]["version"].split()[0]
          resolved: dict[str, str] = {}
          features: dict[str, set[str]] = {}

          for crate_name in crates:
              crate_payload = fetch_json(f"https://crates.io/api/v1/crates/{crate_name}")
              crate = crate_payload["crate"]
              version = (
                  crate.get("max_stable_version")
                  or crate.get("max_version")
                  or crate["newest_version"]
              )
              resolved[crate_name] = version
              version_payload = fetch_json(
                  f"https://crates.io/api/v1/crates/{crate_name}/{version}"
              )
              features[crate_name] = set(version_payload["version"].get("features", {}))

          cargo_path = Path("Cargo.toml")
          cargo = cargo_path.read_text(encoding="utf-8")
          cargo = re.sub(
              r'(?m)^rust-version\s*=\s*"[^"]+"',
              f'rust-version = "{rust_version}"',
              cargo,
          )

          for crate_name, version in resolved.items():
              escaped = re.escape(crate_name)
              cargo = re.sub(
                  rf'(?m)^({escaped}\s*=\s*)"[^"]+"',
                  lambda match, current=version: f'{match.group(1)}"{current}"',
                  cargo,
              )
              cargo = re.sub(
                  rf'(?m)^({escaped}\s*=\s*\{{[^\n]*?version\s*=\s*)"[^"]+"',
                  lambda match, current=version: f'{match.group(1)}"{current}"',
                  cargo,
              )

          sqlx_features = features["sqlx"]
          if "runtime-tokio-rustls" not in sqlx_features:
              replacement = []
              if "runtime-tokio" in sqlx_features:
                  replacement.append('"runtime-tokio"')
              for candidate in (
                  "tls-rustls-ring",
                  "tls-rustls-aws-lc-rs",
                  "tls-rustls",
              ):
                  if candidate in sqlx_features:
                      replacement.append(f'"{candidate}"')
                      break
              if replacement:
                  cargo = cargo.replace(
                      '"runtime-tokio-rustls",',
                      ",\n    ".join(replacement) + ",",
                  )

          reqwest_features = features["reqwest"]
          if "rustls-tls" not in reqwest_features:
              for candidate in (
                  "rustls-tls-webpki-roots",
                  "rustls",
                  "rustls-no-provider",
              ):
                  if candidate in reqwest_features:
                      cargo = cargo.replace('"rustls-tls"', f'"{candidate}"')
                      break

          cargo = re.sub(
              r'(?m)^all\s*=\s*"warn"$',
              'all = { level = "warn", priority = -1 }',
              cargo,
          )
          cargo_path.write_text(cargo, encoding="utf-8")

          Path("rust-toolchain.toml").write_text(
              "[toolchain]\n"
              f'channel = "{rust_version}"\n'
              'profile = "minimal"\n'
              'components = ["clippy", "rustfmt"]\n',
              encoding="utf-8",
          )

          ci_path = Path(".github/workflows/ci.yml")
          if ci_path.exists():
              ci = ci_path.read_text(encoding="utf-8")
              ci = ci.replace("actions/checkout@v4", "actions/checkout@v5")
              ci = re.sub(
                  r'(?m)^(\s*toolchain:\s*)[^\n]+$',
                  rf'\g<1>{rust_version}',
                  ci,
              )
              ci = ci.replace(
                  "cargo clippy --all-targets --all-features -- -D warnings",
                  "cargo clippy --locked --all-targets --all-features -- -D warnings",
              )
              ci = ci.replace(
                  "cargo test --all-features",
                  "cargo test --locked --all-features",
              )
              ci_path.write_text(ci, encoding="utf-8")

          shutil.rmtree(".bootstrap", ignore_errors=True)
          Path(".github/workflows/bootstrap.yml").unlink(missing_ok=True)

          dependabot = Path(".github/dependabot.yml")
          dependabot.write_text(
              """version: 2
          updates:
            - package-ecosystem: cargo
              directory: /
              schedule:
                interval: weekly
                day: monday
                time: \"04:00\"
                timezone: Europe/Berlin
              open-pull-requests-limit: 10
              groups:
                rust-production:
                  dependency-type: production
                rust-development:
                  dependency-type: development
            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
                day: monday
                time: \"04:15\"
                timezone: Europe/Berlin
            - package-ecosystem: docker
              directory: /
              schedule:
                interval: weekly
                day: monday
                time: \"04:30\"
                timezone: Europe/Berlin
          """,
              encoding="utf-8",
          )

          snapshot = {
              "checked_at": "2026-09-02",
              "rust_stable": rust_version,
              "crates": dict(sorted(resolved.items())),
              "sources": {
                  "rust": "https://static.rust-lang.org/dist/channel-rust-stable.toml",
                  **{
                      name: f"https://crates.io/crates/{name}"
                      for name in sorted(resolved)
                  },
              },
          }
          Path("docs/dependency-snapshot.json").write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          Path("docs/DEPENDENCY_POLICY.md").write_text(
              f"""# Dependency and toolchain policy

          ZuckerBot tracks current stable releases. The baseline was refreshed on 2026-09-02.

          ## Rules

          - Rust is pinned to the exact current stable toolchain (`{rust_version}`) in `rust-toolchain.toml`.
          - Direct Cargo dependencies are raised to their current stable releases and `Cargo.lock` is committed.
          - Wildcard requirements and unreviewed pre-release dependencies are forbidden.
          - Dependabot checks Cargo, GitHub Actions and Docker every week.
          - Every dependency update must pass formatting, Clippy with warnings denied, all tests and a release build before merge.
          - Major upgrades are not postponed merely to avoid code migration; API changes are adapted in the same pull request.
          - Security advisories take priority over the weekly cadence.

          “Latest” means the newest stable release verified at update time, not an uncontrolled floating build. Exact source resolution remains reproducible through `Cargo.lock`.
          """,
              encoding="utf-8",
          )

          readme_path = Path("README.md")
          if readme_path.exists():
              readme = readme_path.read_text(encoding="utf-8")
              readme = re.sub(
                  r"> Development status:.*",
                  f"> Development status: active platform bootstrap on Rust {rust_version}. Implemented and planned capabilities are tracked separately in `docs/FEATURE_MATRIX.md`.",
                  readme,
                  count=1,
              )
              readme_path.write_text(readme, encoding="utf-8")

          with Path("/tmp/resolved-rust-version").open("w", encoding="utf-8") as handle:
              handle.write(rust_version)

          with Path("/tmp/dependency-summary").open("w", encoding="utf-8") as handle:
              handle.write(
                  f"Rust {rust_version}; "
                  + ", ".join(f"{name} {version}" for name, version in sorted(resolved.items()))
              )
          PY

          rust_version="$(cat /tmp/resolved-rust-version)"
          echo "rust-version=${rust_version}" >> "$GITHUB_OUTPUT"
          echo "RUST_VERSION=${rust_version}" >> "$GITHUB_ENV"

      - name: Install the resolved Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --no-self-update
          rustup override set "$RUST_VERSION"
          rustc --version --verbose
          cargo --version --verbose

      - name: Resolve the lockfile
        run: cargo update

      - name: Format
        run: cargo fmt --all

      - name: Validate formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build release binaries
        run: cargo build --locked --release --all-features

      - name: Commit the verified refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "The branch already uses all resolved current stable versions."
            exit 0
          fi

          git commit \
            -m "chore: refresh current stable Rust platform" \
            -m "$(cat /tmp/dependency-summary)"
          git push origin HEAD:feat/lua-platform-foundation
