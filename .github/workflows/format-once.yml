name: Format Rust once

on:
  push:
    branches:
      - feat/lua-platform-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/lua-platform-foundation

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Apply canonical formatting
        run: cargo fmt --all

      - name: Commit formatted Rust sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git commit --message "style: apply rustfmt"
          git push
