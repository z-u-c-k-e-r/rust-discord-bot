name: Apply ticket support workflows

on:
  push:
    branches:
      - feat/ticket-support-workflows
    paths:
      - '.github/ticket-integration.trigger'

permissions:
  contents: write

concurrency:
  group: apply-ticket-support-workflows
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: zuckerbot
          POSTGRES_USER: zuckerbot
          POSTGRES_PASSWORD: zuckerbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zuckerbot -d zuckerbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out ticket branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned current stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install native and PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libopus-dev \
            pkg-config \
            postgresql-client

      - name: Verify current stable Rust policy
        run: bash scripts/check-latest-rust.sh

      - name: Apply ticket integration patch
        run: python .github/scripts/apply_ticket_integration.py

      - name: Apply strict Clippy corrections
        run: python .github/scripts/fix_ticket_clippy.py

      - name: Format source
        run: cargo fmt --all

      - name: Resolve locked dependency graph
        run: cargo generate-lockfile

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run unit and contract tests
        run: cargo test --locked --all-features

      - name: Validate every PostgreSQL migration
        env:
          PGPASSWORD: zuckerbot
        shell: bash
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            psql \
              --host 127.0.0.1 \
              --port 5432 \
              --username zuckerbot \
              --dbname zuckerbot \
              --set ON_ERROR_STOP=1 \
              --file "${migration}"
          done

      - name: Build release binary
        run: cargo build --locked --release

      - name: Validate dashboard JavaScript
        run: node --check web/static/app.js

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Build production image
        run: docker build --tag zuckerbot:tickets-ci .

      - name: Remove one-time integration transport
        run: |
          rm -f .github/ticket-integration.trigger
          rm -f .github/scripts/apply_ticket_integration.py
          rm -f .github/scripts/fix_ticket_clippy.py

      - name: Commit validated ticket implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate persistent ticket support workflows"
          git push origin HEAD:feat/ticket-support-workflows
