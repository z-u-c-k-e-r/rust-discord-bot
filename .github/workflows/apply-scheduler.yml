name: Apply persistent scheduler

on:
  push:
    branches:
      - feat/persistent-scheduler-reminders
    paths:
      - '.github/scheduler-integration.trigger'

permissions:
  contents: write

concurrency:
  group: apply-persistent-scheduler
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out scheduler branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned current stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install voice build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libopus-dev \
            pkg-config

      - name: Apply scheduler integration patch
        run: |
          python .github/scripts/apply_scheduler_integration.py
          python .github/scripts/fix_scheduler_sql.py
          python .github/scripts/fix_scheduler_enum_sizes.py

      - name: Format source
        run: cargo fmt --all

      - name: Resolve locked dependency graph
        run: cargo generate-lockfile

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build release binary
        run: cargo build --locked --release

      - name: Remove one-time integration transport
        run: |
          rm -f .github/scheduler-integration.trigger
          rm -f .github/scripts/apply_scheduler_integration.py
          rm -f .github/scripts/fix_scheduler_sql.py
          rm -f .github/scripts/fix_scheduler_enum_sizes.py
          rm -f .github/workflows/apply-scheduler.yml

      - name: Commit validated scheduler implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate persistent scheduler and reminders"
          git push origin HEAD:feat/persistent-scheduler-reminders
