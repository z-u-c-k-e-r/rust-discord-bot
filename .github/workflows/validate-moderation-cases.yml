name: Validate moderation cases slice

on:
  push:
    branches:
      - feat/moderation-cases
    paths:
      - '.github/workflows/validate-moderation-cases.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'migrations/**'
      - 'docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: validate-moderation-cases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contract, lint, test and release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7

      - name: Install pinned latest stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install voice build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libopus-dev \
            pkg-config

      - name: Verify moderation slice contract
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/0002_moderation_case_lifecycle.sql
          test -f docs/MODERATION_CASES.md
          grep -Fq 'CreateModerationCase' src/lua/model.rs
          grep -Fq 'ListModerationCases' src/lua/model.rs
          grep -Fq 'ResolveModerationCase' src/lua/model.rs
          grep -Fq 'create_moderation_case' scripts/moderation.lua
          grep -Fq 'case-resolve' scripts/moderation.lua
          grep -Fq 'moderation/users/{target_user_id}/cases' src/web/mod.rs
          test ! -e .automation/moderation-cases.py.gz.b64
          test ! -e .github/workflows/apply-moderation-cases.yml

      - name: Resolve the pinned graph
        run: cargo generate-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build release binary
        run: cargo build --locked --release
