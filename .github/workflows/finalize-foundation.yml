name: Finalize reproducible foundation

on:
  push:
    branches:
      - feat/lua-platform-foundation
    paths:
      - .github/workflows/finalize-foundation.yml

permissions:
  contents: write

concurrency:
  group: finalize-lua-platform-foundation
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out canonical foundation branch
        uses: actions/checkout@v7
        with:
          ref: feat/lua-platform-foundation
          fetch-depth: 0

      - name: Generate exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup override set 1.98.1
          cargo generate-lockfile
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 > /dev/null
          git diff --check -- Cargo.lock

      - name: Commit only Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git commit -m "build: commit reproducible dependency lock"
          git push origin HEAD:feat/lua-platform-foundation
