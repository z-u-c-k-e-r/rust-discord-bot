name: Repair and finalize moderation cases slice

on:
  push:
    branches:
      - feat/moderation-cases
    paths:
      - '.github/workflows/repair-moderation-cases.yml'

permissions:
  contents: write

concurrency:
  group: repair-moderation-cases
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned latest stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install voice build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libopus-dev \
            pkg-config

      - name: Verify generated feature contract
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/0002_moderation_case_lifecycle.sql
          test -f docs/MODERATION_CASES.md
          grep -Fq 'CreateModerationCase' src/lua/model.rs
          grep -Fq 'ListModerationCases' src/lua/model.rs
          grep -Fq 'ResolveModerationCase' src/lua/model.rs
          grep -Fq 'create_moderation_case' scripts/moderation.lua
          grep -Fq 'case-resolve' scripts/moderation.lua
          grep -Fq 'moderation/users/{target_user_id}/cases' src/web/mod.rs

      - name: Resolve and pin dependency graph
        run: cargo generate-lockfile

      - name: Apply compiler suggestions
        run: cargo fix --workspace --all-targets --all-features --allow-dirty --allow-staged

      - name: Apply Clippy suggestions
        run: cargo clippy --fix --workspace --all-targets --all-features --allow-dirty --allow-staged -- -D warnings

      - name: Format Rust
        run: cargo fmt --all

      - name: Test complete feature set
        run: cargo test --locked --all-features

      - name: Build release binary
        run: cargo build --locked --release

      - name: Verify clean patch
        run: git diff --check

      - name: Remove one-shot workflows
        run: |
          rm -f .github/workflows/repair-moderation-cases.yml
          rm -f .github/workflows/validate-moderation-cases.yml

      - name: Commit finalized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes to commit."
          else
            git commit -m "fix(moderation): finalize case lifecycle implementation"
            git push origin HEAD:feat/moderation-cases
          fi
