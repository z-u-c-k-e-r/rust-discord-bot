name: Apply compile fixes once

on:
  push:
    branches:
      - feat/lua-platform-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/lua-platform-foundation

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Apply verified fixes
        shell: python
        run: |
          from pathlib import Path

          config = Path("src/config.rs")
          text = config.read_text()
          old = 'let discord_application_id = required("DISCORD_APPLICATION_ID")?'
          new = 'let discord_application_id: u64 = required("DISCORD_APPLICATION_ID")?'
          if old not in text:
              raise SystemExit("expected config pattern was not found")
          config.write_text(text.replace(old, new, 1))

          executor = Path("src/discord/executor.rs")
          text = executor.read_text()
          old = '    lua::{LuaAction, MusicOperation},\n'
          new = '    lua::LuaAction,\n'
          if old not in text:
              raise SystemExit("expected executor import was not found")
          executor.write_text(text.replace(old, new, 1))

      - name: Format patched sources
        run: cargo fmt --all

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config.rs src/discord/executor.rs
          git commit --message "fix: resolve initial Rust type checks"
          git push
