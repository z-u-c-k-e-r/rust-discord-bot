name: Bootstrap source tree

on:
  push:
    branches:
      - feat/lua-platform-foundation
    paths:
      - '.bootstrap/run'

permissions:
  contents: write

concurrency:
  group: bootstrap-lua-platform-foundation
  cancel-in-progress: false

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every transport part
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.sha256 <<'SHA256'
          13d920000048a999a633a889ecae124e811c568d2ef1c877feb10ffb5b209ff3  .bootstrap/payload.part00
          217211cdaa0ebb7b5e2021bc3a292fa31d50d9d373a0861d238d32465165eb72  .bootstrap/payload.part01
          a47145c59d73f2562b3ee8217784a44a34ddaac6f9c494f0615c6978de8e7e07  .bootstrap/payload.part02
          34bd34f4aa512e23f9375752d11d023811648a98976ed6a46a170c7fed7cd133  .bootstrap/payload.part03
          a5cd7a916f46d56265b4dc31d11269cd25445b710d1cc7c1ac4b8453308951d2  .bootstrap/payload.part04
          6ed1ad6848eeb05887403d4adf9d76af1ab51e37a17f90862407701e97ee4c4e  .bootstrap/payload.part05
          325380133ee0f287fc79b9d56cd648afef3c6fc577fffb5203a80f672491b0cc  .bootstrap/payload.part06
          9e4673875118bf1c4f84d46ec349fca93b8dba065df408757720369db7efed2e  .bootstrap/payload.part07
          499fffd9ae9d38f5c496a4a4807626c13a4d4b57f0f9ce086f69745975544c59  .bootstrap/payload.part08
          17500b43cc45056757a1ce110bd87282a45418b9fa3b63b64b4a0f5c518be895  .bootstrap/payload.part09
          07f817235dd713d766692fb54f77b102336fb144ddcb06cf0f8ad32934152129  .bootstrap/payload.part10
          00eb47c512d1b80282c573bd185c0bf2a771598d27356446199f0d75d7e1de60  .bootstrap/payload.part11
          af7e50598fbf7ddd970936c33dafe665a36ac30aa9ee2570f65fc4e552e709f1  .bootstrap/payload.part12
          SHA256
          sha256sum --check /tmp/payload.sha256

      - name: Reconstruct and verify the source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* > /tmp/zuckerbot-source.tar.xz.b64
          base64 --decode /tmp/zuckerbot-source.tar.xz.b64 > /tmp/zuckerbot-source.tar.xz
          test "$(sha256sum /tmp/zuckerbot-source.tar.xz | cut -d ' ' -f 1)" = "d01cc8d364e88a73a764f7c99ba652dd507c063558532182e0d7e3cc5b23ed56"

      - name: Unpack the project and remove bootstrap transport files
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/zuckerbot-source.tar.xz -C .
          test -f Cargo.toml
          test -f src/main.rs
          test -f scripts/core.lua
          test -f web/index.html
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit the real source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Lua-scriptable Discord platform foundation"
          git push origin HEAD:feat/lua-platform-foundation
