name: Bootstrap source tree

on:
  push:
    branches:
      - feat/lua-platform-foundation
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-lua-platform-foundation
  cancel-in-progress: false

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify the source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* > /tmp/zuckerbot-source.tar.gz.b64
          base64 --decode /tmp/zuckerbot-source.tar.gz.b64 > /tmp/zuckerbot-source.tar.gz
          test "$(sha256sum /tmp/zuckerbot-source.tar.gz | cut -d ' ' -f 1)" = "7355840fb3abbd70d93e45b091239f518e1d38ba2e6c0d94cad50aa10b568227"

      - name: Unpack the project and remove bootstrap transport files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/zuckerbot-source.tar.gz -C .
          test -f Cargo.toml
          test -f src/main.rs
          test -f scripts/core.lua
          test -f web/index.html
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit the real source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Lua-scriptable Discord platform foundation"
          git push origin HEAD:feat/lua-platform-foundation
