name: Source snapshot

on:
  push:
    branches:
      - feat/persistent-scheduler-reminders

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: scheduler-source-${{ github.sha }}
          path: |
            Cargo.toml
            rust-toolchain.toml
            src
            scripts
            migrations
            tests
            docs
            web
            .env.example
            Dockerfile
            docker-compose.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
